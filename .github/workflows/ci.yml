name: CI

# Four jobs, four questions:
#   rust      does the backend build, lint and pass its tests against a real Postgres
#   frontend  does the frontend type-check and pass its unit tests
#   e2e       does the whole stack pass the Playwright suite, on its own seeded database
#   offline   can the release image compile without a database
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    # The format job's fix-up commits are already covered by the run that produced them.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wormholesystems
          POSTGRES_PASSWORD: wormholesystems
          POSTGRES_DB: wormholesystems
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wormholesystems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Compile against `.sqlx`, not the database. `#[sqlx::test]` applies the migrations
      # when each test runs, so at compile time this database is still empty and the macros
      # would fail on every query. The offline job below is what keeps the cache honest.
      SQLX_OFFLINE: "true"
      # Every outbound request carries a contact; CI's is this repository.
      WS_CONTACT_NAME: "WormholeSystems CI"
      WS_CONTACT_EMAIL: "ci@wormhole.systems"
      # `#[sqlx::test]` makes a fresh database per test from this connection and applies the
      # migrations itself. The tests seed the handful of systems they need, so no SDE.
      DATABASE_URL: postgres://wormholesystems:wormholesystems@localhost:5432/wormholesystems

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The parse tests read real SDE files, which are a 100MB download kept out of the
      # repo. Cached against CCP's build number, so a new build fetches once and every run
      # after it reuses the unpacked copy.
      - name: Which SDE build is current
        id: sde
        run: |
          build=$(curl -fsS --max-time 20 https://developers.eveonline.com/static-data/tranquility/latest.jsonl \
            | sed -n 's/.*"buildNumber": *\([0-9]*\).*/\1/p')
          echo "build=${build:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the SDE
        id: sde-cache
        uses: actions/cache@v4
        with:
          path: data/sde
          key: sde-${{ steps.sde.outputs.build }}

      - name: Fetch the SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: cargo run --locked -- sde-fetch

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Generated TS bindings are committed
        run: git diff --exit-code frontend/src/lib/api/types

      - name: Generated OpenAPI document is committed
        run: git diff --exit-code docs/openapi.json

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wormholesystems
          POSTGRES_PASSWORD: wormholesystems
          POSTGRES_DB: wormholesystems
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wormholesystems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLX_OFFLINE: "true"
      WS_CONTACT_NAME: "WormholeSystems CI"
      WS_CONTACT_EMAIL: "ci@wormhole.systems"
      # The suite makes its own `wormholesystems_e2e` next to this one, and the API seeds
      # it from the SDE on its first boot.
      DATABASE_URL: postgres://wormholesystems:wormholesystems@localhost:5432/wormholesystems
      # The specs create their identities in the database and ESI is stubbed, so nobody
      # signs in through EVE; the API only needs these to start.
      EVE_CLIENT_ID: ci
      EVE_CLIENT_SECRET: ci
      EVE_REDIRECT_URI: http://localhost:5173/auth/callback

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The same SDE cache as the rust job: the API seeds the e2e database from it.
      - name: Which SDE build is current
        id: sde
        run: |
          build=$(curl -fsS --max-time 20 https://developers.eveonline.com/static-data/tranquility/latest.jsonl \
            | sed -n 's/.*"buildNumber": *\([0-9]*\).*/\1/p')
          echo "build=${build:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the SDE
        id: sde-cache
        uses: actions/cache@v4
        with:
          path: data/sde
          key: sde-${{ steps.sde.outputs.build }}

      - name: Fetch the SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: cargo run --locked -- sde-fetch

      # Built ahead, so Playwright's wait for the API is the boot and the seed, not the
      # compile.
      - name: Build the API
        run: cargo build --locked

      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npx vitest run

  offline:
    name: builds without a database
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    # `.sqlx` is what lets the release image compile without a database: the Dockerfile
    # builds with SQLX_OFFLINE=true. Nothing local notices when it falls behind, because dev
    # builds and tests talk to a real Postgres, so it rots quietly and the next deploy finds
    # out. It had drifted by 200 queries before this job existed.
    #
    # This compiles the way the image does rather than running `sqlx prepare --check`: sqlx
    # infers nullability from Postgres's query plan, so an empty CI database and a populated
    # developer one disagree about columns the planner cannot prove non-null, and the check
    # fails on a cache that is perfectly good.
    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compile against the query cache
        run: |
          if ! cargo check --workspace --all-targets --locked; then
            echo "::error::.sqlx is out of date, so the production image cannot build."
            echo "Regenerate it against a migrated, seeded database and commit the result:"
            echo "  cargo sqlx prepare -- --all-targets"
            exit 1
          fi
